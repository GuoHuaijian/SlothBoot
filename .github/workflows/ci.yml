name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and Test
        run: mvn -B -U clean verify

      - name: Checkstyle
        run: mvn -B checkstyle:check -DskipTests -pl '!sloth-boot-example,!sloth-boot-generator'

      - name: SpotBugs
        run: mvn -B spotbugs:check -DskipTests -pl '!sloth-boot-example,!sloth-boot-generator'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/target/surefire-reports/'
          retention-days: 7
